name: Compilar APK Android
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar proyecto Android completo
        shell: bash
        run: |
          set -euo pipefail
          flutter create --empty --platforms=android --org cl.marcador --project-name marcador_deportivo_bt "$RUNNER_TEMP/marcador_build"
          cp marcador_deportivo_bluetooth_flutter/pubspec.yaml "$RUNNER_TEMP/marcador_build/pubspec.yaml"
          rm -rf "$RUNNER_TEMP/marcador_build/lib"
          cp -R marcador_deportivo_bluetooth_flutter/lib "$RUNNER_TEMP/marcador_build/lib"
          cp marcador_deportivo_bluetooth_flutter/android/app/src/main/AndroidManifest.xml "$RUNNER_TEMP/marcador_build/android/app/src/main/AndroidManifest.xml"
      - name: Descargar dependencias
        run: cd "$RUNNER_TEMP/marcador_build" && flutter pub get
      - name: Analizar código
        run: cd "$RUNNER_TEMP/marcador_build" && flutter analyze --no-fatal-infos
      - name: Compilar APK instalable de pruebas
        run: cd "$RUNNER_TEMP/marcador_build" && flutter build apk --release
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Marcador-Android-APK
          path: ${{ runner.temp }}/marcador_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
