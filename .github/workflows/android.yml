name: Cancha v2 · pruebas y APK
on:
  push:
    branches: [v.2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cancha-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: marcador_deportivo_bluetooth_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar Android
        run: bash tool/bootstrap.sh --prepare
      - name: Formatear y analizar
        run: |
          dart format lib test
          flutter analyze
      - name: Pruebas de reglas, control y pantallas
        run: flutter test --reporter expanded
      - name: Generar APK instalable
        run: flutter build apk --release
      - name: Guardar APK v2
        uses: actions/upload-artifact@v4
        with:
          name: Cancha-v2-Android
          path: marcador_deportivo_bluetooth_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Guardar vistas de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cancha-v2-vistas
          path: marcador_deportivo_bluetooth_flutter/build/previews/*.png
          if-no-files-found: ignore
